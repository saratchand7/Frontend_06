<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    header{
        background: #dfe20d;
        border: solid 2px black;
        padding: 3%;
        position: sticky;
        top: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-decoration: underline;
    
    }
    header button{
        background: rgb(222, 158, 19);
        border: solid 2px black;
        padding: 10px 20px;
        font-weight: bold;
    }
    section{
        padding: 3%;
        display: flex;
        align-items: center;
        font-size: 2rem;
    }
    section>div{
        flex: basis 50%;
    }
    section img{
        width: 100%;
        height: 100%;
    }
</style>
<body>
    <header>
        <h1>Brand name</h1>
        <div>
            <button>Home</button>
            <button>About</button>
            <button>Contact</button>
        </div>
    </header>
    <section>
        <div>
            <h1>Company Name</h1>
            <p>About the company</p>
            <button>View Details</button>
        </div>
        <div>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQqKWLy-H08gZaXfXX97gaZTGdRkaZDinI7wo73WMqRvhZyGOVzD22XbskO&s=10" alt="Company Image">
        </div>
        
    </section>
    <section>
        <div>
            
            <img src="https://cdn.logojoy.com/wp-content/uploads/2018/05/01104800/1050.png" alt="">
        </div>
        <div>
            <h1>Company Name</h1>
            <p>About the company</p>
            <button>View Details</button>
        </div>
    </section>
</body>
</html>
