
<!DOCTYPE html>
<html>
<head>
    <title>My First Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>

    <form>

        Name:
        <input type="text" placeholder="Enter your name">
        <br><br>

        Email:
        <input type="email" placeholder="Enter email">
        <br><br>

        Password:
        <input type="password" placeholder="Enter password">
        <br><br>

        Mobile Number:
        <input type="number" placeholder="Enter mobile number">
        <br><br>

        Date of Birth:
        <input type="date">
        <br><br>

        Choose Your branch:
        <br>
        <!-- <a href="day1/index.html"></a>
        <a href="day2/index.html"></a> -->

        <input id="cs" type="radio" name="course"> <label for="cs">CSE</label>
        <br>
        <input id="ee" type="radio" name="course"> <label for="ee">EEE</label>
        <br>
        <input id="me" type="radio" name="course"> <label for="me">MECH</label>
        <br><br>

        Upload Photo:
        <input type="file">
        <br><br>

        Choose Your Course:
        <br>

        <input type="radio" name="course"> Python
        <br>
        <input type="radio" name="course"> Java
        <br>
        <input type="radio" name="course"> MERN
        <br><br>

        Choose Your Skills:
        <br>

        <input type="checkbox"> HTML
        <br>
        <input type="checkbox"> CSS
        <br>
        <input type="checkbox"> JavaScript
        <br><br>

        Select Your Branch:
        <select>
            <option>Vizag</option>
            <option>Hyderabad</option>
            <option>Vijayawada</option>
        </select>
        <br><br>

        Favorite Color:
        <input type="color">
        <br><br>

        Enter Website:
        <input type="url" placeholder="https://example.com">
        <br><br>

        <input type="checkbox">
        I agree to the terms and conditions.
        <br><br>

        <input type="reset" value="Reset">
        <input type="submit" value="Register">

    </form>

</body>
</html>
