<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
    </head>
    <body>
        <h1>login portal</h1>
    <form action="" method="post">
        <label for ="un">username:</label>
        <input id ="un" type="text" name="uname" placeholder="@gmail.com"> <br>
        <label for ="pwd">password:</label>
        <input required id ="pwd" type="password" name="password" placeholder="*****"> <br>
        enter ur email
        <input type="email"><br>
        enter ur mobile number
        <input type="number"><br>
        book you appointment
        <input type="date"><br>
        book your slot
        <input type="datetime-local"><br>
        upload your file
        <input type="file"><br>
        search your product
        <input type="search"><br>
        rate yourself
        <input type="range"><br>
        <button type="reset">reset</button>
        <button type="submit">submit</button>
    </form>

    <form action="">
        choose your stack <br>
        <input id="py" type="radio" name="stack" value="pythonstack">
        <label for="py">python stack</label><br>
        <input id="js" type="radio" name="stack" value="javastack">
        <label for="js">java stack</label><br>
        <input id="ms" type="radio" name="stack" value="mernstack">
        <label for="ms">mern stack</label><br>

        choose your skill <br>
        <input type="checkbox" name="skills" value="html">
        <label for="">html</label>
        <input type="checkbox" name="skills" value="css">
        <label for="">css</label><br>

        select your branch
        <select name="branch" id="">
            <option value="vizag">vizag</option>
            <option value="hyd">hyd</option>
        </select> <br>
        <button type="submit">submit</button>
    </form>
    </body>
</html>
